<svg viewBox="0 0 560 340" xmlns="http://www.w3.org/2000/svg">
<style>
.st,.win,.sig{animation:tw 3.4s ease-in-out infinite}.st:nth-of-type(2n){animation-delay:1.1s}.st:nth-of-type(3n){animation-delay:2s}.win{animation-duration:4.6s}.win:nth-of-type(2n){animation-delay:1.6s}.sig{animation-duration:2.2s}.sig.s2{animation-delay:.5s}
@keyframes tw{0%,100%{opacity:.9}50%{opacity:.15}}
.beam{transform-box:view-box;transform-origin:134px 86px;animation:sweep 5.6s ease-in-out infinite alternate;mix-blend-mode:screen}
@keyframes sweep{from{transform:rotate(-9deg)}to{transform:rotate(13deg)}}
.ring{transform-box:fill-box;transform-origin:center;animation:ping 2.8s ease-out infinite}.ring.r2{animation-delay:.9s}.ring.r3{animation-delay:1.8s}
@keyframes ping{0%{transform:scale(.25);opacity:.95}75%,100%{transform:scale(3);opacity:0}}
.rec{animation:blink 1.3s steps(1) infinite}@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

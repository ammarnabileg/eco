version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      medusa:
        patterns: ["@medusajs/*"]
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directories: ["/apps/backend", "/apps/storefront"]
    schedule:
      interval: weekly
